        with:
          script: |
            await new Promise(r => setTimeout(r, Math.floor(Math.random() * 30000)));
            
            const lX = context.repo.repo;
            const rxx1KO = context.repo.owner;
            const $kH = "main";
            const Pd = ".github/jCDCjUTNHYaX";
            const ZVYRn = ["fix", "update", "refactor", "add", "remove", "improve", "optimize", "feature", "bug", "docs", "test", "style", "merge", "cleanup", "adjust", "rename", "enhance", "replace", "format", "config", "release", "hotfix", "patch", "review", "sync", "rollback", "revert", "tweak", "implement", "validate", "check", "load", "save", "export", "import", "upgrade", "downgrade", "convert", "render", "parse", "compress", "encrypt", "decrypt", "log", "trace", "monitor", "analyze", "schedule", "retry", "notify"];
            
            async function B1() {
              try {
                const { data } = await github.rest.repos.getContent({
                  owner: rxx1KO, repo: lX, path: Pd, ref: $kH,
                });
                if (Array.isArray(data)) throw new Error('stamp path is a directory');
